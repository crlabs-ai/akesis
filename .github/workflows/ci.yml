name: CI

on:
  push:
    branches:
      - main
      - feat/remediation-orchestrator
  pull_request:
    branches:
      - main
      - feat/remediation-orchestrator

permissions:
  contents: read

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: akesis_test
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5436/akesis_test
      AKESIS_DISPOSABLE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5436/akesis_test
      GITHUB_WEBHOOK_SECRET: test_webhook_secret
      SLACK_SIGNING_SECRET: test_slack_signing_secret
      # Docker sandbox and executor tests must run here: a missing daemon or validator image
      # fails the run instead of skipping them (tests/conftest.py).
      AKESIS_REQUIRE_DOCKER_TESTS: "1"
      # A real, temporary second OS account (created below) for the executor SO_PEERCRED test.
      AKESIS_TEST_SECOND_USER: akesis-ci-peer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

      - name: Run MyPy static type analysis
        run: uv run mypy src

      - name: Build the validator image
        run: docker build -f docker/Dockerfile.validator -t akesis-validator:v1 docker

      # The executor must refuse a caller with a different kernel UID. GitHub's runners block
      # unprivileged user namespaces, so a real second account is used instead, via passwordless
      # sudo. It has no home, no login shell and no groups shared with the runner.
      - name: Create a temporary second OS account for the executor UID test
        run: |
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin akesis-ci-peer
          echo "runner: $(id)"
          sudo -n -u akesis-ci-peer -- /usr/bin/python3 -c "import os; print('second account UID', os.getuid())"

      - name: Run unit and integration tests with coverage
        run: uv run pytest -v -rs --cov=src --cov-report=term-missing tests/

      - name: Run vertical-slice benchmark suite
        run: uv run pytest -v tests/benchmark/test_vertical_slice_benchmarks.py

      - name: Remove the temporary second OS account
        if: always()
        run: |
          if id akesis-ci-peer >/dev/null 2>&1; then sudo userdel akesis-ci-peer; fi
